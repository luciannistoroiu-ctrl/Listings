<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=2000" />
    <title>Doncafe Elita - Metode de preparare</title>
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1600px;
        height: 2000px;
        overflow: hidden;
        background: #6d1626;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Poppins", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .clip { position: absolute; inset: 0; }
      #bg {
        background: radial-gradient(ellipse 1200px 1000px at 50% 20%, #7c1c2c 0%, #6d1626 55%, #5c101f 100%);
      }
      .swirl { position: absolute; border-radius: 50%; border: 24px solid rgba(255,255,255,0.03); }
      .swirl.s1 { width: 1500px; height: 1500px; left: -400px; top: 500px; }
      .swirl.s2 { width: 1200px; height: 1200px; left: -250px; top: 700px; border-color: rgba(255,255,255,0.045); }

      #heading {
        position: absolute;
        top: 150px;
        left: 0;
        right: 0;
        text-align: center;
      }
      #heading h1 {
        color: #ffffff;
        font-size: 66px;
        font-weight: 800;
      }
      #heading p {
        margin-top: 16px;
        color: #f2d49b;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 2px;
      }

      #methods {
        position: absolute;
        top: 520px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 100px;
      }
      .method {
        display: flex;
        align-items: center;
        gap: 60px;
        width: 1100px;
      }
      .badge {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe9ad, #c8992f 70%, #9c7420 100%);
        border: 6px solid #f4dc9c;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .badge svg { width: 110px; height: 110px; }
      .method-label {
        color: #ffffff;
        font-size: 50px;
        font-weight: 800;
      }

      #footer {
        position: absolute;
        bottom: 120px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255,255,255,0.55);
        font-size: 28px;
        letter-spacing: 5px;
        font-weight: 600;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="metode" data-start="0" data-width="1600" data-height="2000" data-duration="1">
      <section id="bg" class="clip" data-start="0" data-duration="1" data-layout-allow-overflow>
        <div class="swirl s1"></div>
        <div class="swirl s2"></div>
      </section>

      <section id="heading" class="clip" data-start="0" data-duration="1">
        <h1>Se prepară cum vrei tu</h1>
        <p>DONCAFÉ ELITA</p>
      </section>

      <section id="methods" class="clip" data-start="0" data-duration="1">
        <div class="method">
          <div class="badge">
            <svg viewBox="0 0 110 110" fill="none">
              <rect x="15" y="35" width="80" height="55" rx="8" stroke="#5c101f" stroke-width="7"/>
              <rect x="30" y="15" width="50" height="25" rx="6" stroke="#5c101f" stroke-width="7"/>
              <path d="M35 90 L35 100 M75 90 L75 100" stroke="#5c101f" stroke-width="7" stroke-linecap="round"/>
              <circle cx="55" cy="62" r="10" stroke="#5c101f" stroke-width="6"/>
            </svg>
          </div>
          <div class="method-label">Espressor automat</div>
        </div>

        <div class="method">
          <div class="badge">
            <svg viewBox="0 0 110 110" fill="none">
              <rect x="35" y="10" width="40" height="28" rx="6" stroke="#5c101f" stroke-width="7"/>
              <path d="M40 38 L36 70 Q36 80 46 80 L64 80 Q74 80 74 70 L70 38" stroke="#5c101f" stroke-width="7" stroke-linejoin="round"/>
              <rect x="42" y="80" width="26" height="20" rx="4" stroke="#5c101f" stroke-width="7"/>
              <circle cx="55" cy="24" r="5" fill="#5c101f"/>
            </svg>
          </div>
          <div class="method-label">Râșniță</div>
        </div>

        <div class="method">
          <div class="badge">
            <svg viewBox="0 0 110 110" fill="none">
              <path d="M40 30 Q30 30 30 45 L34 85 Q35 95 45 95 L65 95 Q75 95 76 85 L80 45 Q80 30 70 30 Z" stroke="#5c101f" stroke-width="7" stroke-linejoin="round"/>
              <path d="M80 45 Q98 45 98 60 Q98 75 80 72" stroke="#5c101f" stroke-width="7" fill="none"/>
              <rect x="46" y="16" width="18" height="14" rx="3" stroke="#5c101f" stroke-width="6"/>
            </svg>
          </div>
          <div class="method-label">Ibric</div>
        </div>
      </section>

      <section id="footer" class="clip" data-start="0" data-duration="1">1 KG · CAFEA BOABE PRĂJITĂ</section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["metode"] = tl;
    </script>
  </body>
</html>
